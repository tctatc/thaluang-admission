name: ตรวจและเผยแพร่หน้าเว็บขึ้น GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: ตรวจคุณภาพและ build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: ติดตั้ง dependency ของกฎกลาง (shared)
        run: npm ci

      - name: ตรวจ type และรันเทส (รวมไฟล์ Apps Script)
        run: npm run verify

      - name: ตรวจว่า Domain.gs ที่ commit ไว้ตรงกับ shared/ ล่าสุด
        # ถ้าไม่ตรง แปลว่าแก้ shared/ แล้วลืมรัน npm run build:domain ฝั่ง Apps Script จะใช้กฎเก่า
        run: |
          npm run build:domain
          if ! git diff --quiet -- apps-script/Domain.gs; then
            echo "::error::apps-script/Domain.gs ไม่ตรงกับ shared/ — รัน 'npm run build:domain' แล้ว commit ใหม่"
            exit 1
          fi

      - name: ติดตั้ง dependency ของหน้าเว็บ
        working-directory: web
        run: npm ci

      - name: ตรวจ type และ build หน้าเว็บ
        working-directory: web
        # ยังไม่ตั้ง VITE_API_URL ใน Settings > Secrets and variables > Actions > Variables = โหมดสาธิต
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    name: เผยแพร่
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
